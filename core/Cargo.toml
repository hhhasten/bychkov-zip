[package]
name = "bychkov-zip"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "byz"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = { version = "0.6.0", features = ["zeroize"] }
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
thiserror = "2.0.21"
zeroize = "1.9.1"
rpassword = "7.5.4"

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[profile.dev.package."*"]
opt-level = 3
